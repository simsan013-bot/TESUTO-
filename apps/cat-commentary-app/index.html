<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デブ猫スカッとコメント生成ツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1208;
    background-image:
      radial-gradient(ellipse at 20% 20%, #2d1f0a 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, #0a1a0a 0%, transparent 60%);
    color: #f0e6c8;
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  .wrap { max-width: 680px; margin: 0 auto; }

  /* ヘッダー */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 28px 24px 20px;
    border-bottom: 1px solid #3a2a10;
  }
  .header-icon { font-size: 40px; line-height: 1; }
  .header-title { font-size: 20px; font-weight: 700; color: #f5c842; letter-spacing: .05em; }
  .header-sub { font-size: 12px; color: #8a7a5a; margin-top: 3px; }

  /* タブ */
  .tabs { display: flex; padding: 12px 24px 0; gap: 8px; }
  .tab {
    padding: 8px 20px;
    border-radius: 8px 8px 0 0;
    border: 1px solid #3a2a10;
    border-bottom: none;
    background: #231708;
    color: #8a7a5a;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: all .15s;
  }
  .tab.active { background: #2d1f0a; color: #f5c842; border-color: #5a3a10; }

  /* パネル */
  .panel {
    background: #2d1f0a;
    border: 1px solid #5a3a10;
    border-radius: 0 8px 8px 8px;
    margin: 0 24px;
    padding: 20px;
  }

  .label { display: block; font-size: 13px; color: #c8a84a; margin-bottom: 8px; font-weight: 600; }

  textarea {
    width: 100%;
    background: #1a1208;
    border: 1px solid #4a3218;
    border-radius: 8px;
    color: #f0e6c8;
    font-size: 14px;
    line-height: 1.7;
    padding: 12px 14px;
    font-family: inherit;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: #c8842a; }

  .btn {
    margin-top: 14px;
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #c8842a, #f5a832);
    border: none;
    border-radius: 10px;
    color: #1a1208;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: .05em;
    transition: opacity .2s;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* 出力ボックス */
  .output-box {
    margin-top: 20px;
    background: #1a1208;
    border: 1px solid #5a3a10;
    border-radius: 10px;
    padding: 16px;
    display: none;
  }
  .output-box.show { display: block; }
  .output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
    color: #c8a84a;
    font-weight: 600;
  }
  .output-text { font-size: 14px; line-height: 1.85; white-space: pre-wrap; color: #f0e6c8; }

  .copy-btn {
    background: #3a2a10;
    border: 1px solid #5a3a10;
    border-radius: 6px;
    color: #c8a84a;
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: inherit;
  }
  .copy-btn:active { opacity: .7; }

  /* ローディング */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid #1a1208;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 履歴タブ */
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .dl-btn {
    background: linear-gradient(135deg, #2a5a2a, #3a8a3a);
    border: none;
    border-radius: 7px;
    color: #c8f0c8;
    font-size: 13px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
  }
  .dl-btn:disabled { opacity: .45; cursor: not-allowed; }

  .history-item {
    background: #1a1208;
    border: 1px solid #4a3218;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .history-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .history-date { font-size: 11px; color: #6a5a3a; }
  .history-scenario {
    font-size: 12px;
    color: #8a7a5a;
    margin-bottom: 8px;
    border-bottom: 1px solid #3a2a10;
    padding-bottom: 6px;
  }
  .history-output { font-size: 13px; line-height: 1.75; white-space: pre-wrap; color: #d0c8a8; }

  .empty { text-align: center; color: #5a4a2a; padding: 30px 0; font-size: 14px; }

  /* トースト通知 */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #3a8a3a;
    color: #fff;
    padding: 10px 22px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    transition: transform .3s ease;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-icon">🐾</div>
    <div>
      <div class="header-title">デブ猫の人間観察チャンネル</div>
      <div class="header-sub">シナリオ → スカッとコメント 自動生成</div>
    </div>
  </div>

  <!-- タブ -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('generate', this)">✍️ 生成</button>
    <button class="tab" onclick="switchTab('history', this)">📂 履歴</button>
  </div>

  <!-- 生成パネル -->
  <div class="panel" id="panel-generate">
    <label class="label">📋 シナリオを貼り付けて</label>
    <textarea id="scenario" rows="9" placeholder="今回のシナリオをここに入力…"></textarea>
    <button class="btn" id="genBtn" onclick="generate()">🐾 猫に喋らせる</button>

    <div class="output-box" id="outputBox">
      <div class="output-header">
        <span>🐱 猫のコメント</span>
        <button class="copy-btn" onclick="copyText('outputText')">📋 コピー</button>
      </div>
      <div class="output-text" id="outputText"></div>
    </div>
  </div>

  <!-- 履歴パネル -->
  <div class="panel" id="panel-history" style="display:none">
    <div class="history-header">
      <span class="label" style="margin:0">📂 保存済み</span>
      <button class="dl-btn" id="dlBtn" onclick="downloadAll()">💾 全件DL</button>
    </div>
    <div id="historyList"><div class="empty">まだ何も生成してへんで</div></div>
  </div>

</div>

<!-- トースト -->
<div class="toast" id="toast"></div>

<script>
  var history = [];

  // ============================================================
  //  タブ切り替え
  // ============================================================
  function switchTab(name, el) {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    el.classList.add('active');
    document.getElementById('panel-generate').style.display = name === 'generate' ? '' : 'none';
    document.getElementById('panel-history').style.display  = name === 'history'  ? '' : 'none';
    if (name === 'history') renderHistory();
  }

  // ============================================================
  //  生成実行
  // ============================================================
  function generate() {
    var scenario = document.getElementById('scenario').value.trim();
    if (!scenario) return;

    var btn = document.getElementById('genBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>考え中…';
    document.getElementById('outputBox').classList.remove('show');

    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false;
        btn.textContent = '🐾 猫に喋らせる';

        if (result.success) {
          document.getElementById('outputText').textContent = result.output;
          document.getElementById('outputBox').classList.add('show');

          // 履歴に追加
          var entry = {
            id: Date.now(),
            date: new Date().toLocaleString('ja-JP'),
            scenario: scenario,
            scenarioShort: scenario.length > 60 ? scenario.slice(0, 60) + '…' : scenario,
            output: result.output
          };
          history.unshift(entry);

        } else {
          showToast('エラー: ' + result.error, '#8a2a2a');
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = '🐾 猫に喋らせる';
        showToast('通信エラーやで: ' + err.message, '#8a2a2a');
      })
      .handlePost(scenario);
  }

  // ============================================================
  //  履歴表示
  // ============================================================
  function renderHistory() {
    var list = document.getElementById('historyList');
    var dlBtn = document.getElementById('dlBtn');

    if (history.length === 0) {
      list.innerHTML = '<div class="empty">まだ何も生成してへんで</div>';
      dlBtn.disabled = true;
      return;
    }

    dlBtn.disabled = false;
    var html = '';
    history.forEach(function(h) {
      html += '<div class="history-item">'
        + '<div class="history-meta">'
        + '  <span class="history-date">' + h.date + '</span>'
        + '  <button class="copy-btn" onclick="copyOutput(\'' + h.id + '\')">📋 コピー</button>'
        + '</div>'
        + '<div class="history-scenario">📋 ' + escHtml(h.scenarioShort) + '</div>'
        + '<div class="history-output" id="ho-' + h.id + '">' + escHtml(h.output) + '</div>'
        + '</div>';
    });
    list.innerHTML = html;
  }

  // ============================================================
  //  コピー
  // ============================================================
  function copyText(elId) {
    var text = document.getElementById(elId).textContent;
    navigator.clipboard.writeText(text).then(function() { showToast('📋 コピーしたで！'); });
  }

  function copyOutput(id) {
    var el = document.getElementById('ho-' + id);
    if (!el) return;
    navigator.clipboard.writeText(el.textContent).then(function() { showToast('📋 コピーしたで！'); });
  }

  // ============================================================
  //  全件ダウンロード（.txt）
  // ============================================================
  function downloadAll() {
    if (history.length === 0) return;
    var lines = history.map(function(h, i) {
      return '=== ' + (i + 1) + '件目 / ' + h.date + ' ===\n'
        + '【シナリオ】\n' + h.scenario + '\n\n'
        + '【猫のコメント】\n' + h.output + '\n';
    }).join('\n' + '─'.repeat(40) + '\n\n');

    var blob = new Blob([lines], { type: 'text/plain;charset=utf-8' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href     = url;
    a.download = 'neko_scripts_' + new Date().toISOString().slice(0, 10) + '.txt';
    a.click();
    URL.revokeObjectURL(url);
    showToast('💾 ダウンロード開始したで！');
  }

  // ============================================================
  //  トースト
  // ============================================================
  function showToast(msg, bg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = bg || '#3a8a3a';
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  // ============================================================
  //  HTMLエスケープ
  // ============================================================
  function escHtml(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>

</body>
</html>
